services:
  drivers_api:
        build:
          context: $PWD/drivers_api
          dockerfile: $PWD/drivers_api/Dockerfile
        image: drivers_api
        container_name: drivers_api
        hostname: drivers_api
        read_only: false
        healthcheck:
            test: ["CMD-SHELL", "exit 0"]
            interval: 5m
        environment:
          AppName: "drivers_api"
        volumes:
          - "/dev:/dev"
        privileged: false
        ports:
        - "8000:8000"
        deploy:
          resources:
            limits:
              cpus: "1"
              memory: "1G"